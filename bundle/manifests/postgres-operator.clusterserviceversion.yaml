apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "postgres.oebc.tools/v1",
          "kind": "PgDatabase",
          "metadata": {
            "labels": {
              "app.kubernetes.io/created-by": "postgres-operator",
              "app.kubernetes.io/instance": "pgdatabase-sample",
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "pgdatabase",
              "app.kubernetes.io/part-of": "postgres-operator"
            },
            "name": "mydb"
          },
          "spec": {
            "defaultPrivileges": [],
            "deletion": {
              "drop": false,
              "wait": false
            },
            "instance": {
              "name": "my-instance",
              "namespace": "default"
            },
            "publicPrivileges": {
              "revoke": false
            },
            "publicSchema": {
              "drop": false
            }
          }
        },
        {
          "apiVersion": "postgres.oebc.tools/v1",
          "kind": "PgInstance",
          "metadata": {
            "name": "my-instance"
          },
          "spec": {
            "database": {
              "secretKeyRef": {
                "key": "dbname",
                "name": "my-secret"
              }
            },
            "host": {
              "secretKeyRef": {
                "key": "hostname",
                "name": "my-secret"
              }
            },
            "password": {
              "secretKeyRef": {
                "key": "password",
                "name": "my-secret"
              }
            },
            "port": {
              "secretKeyRef": {
                "key": "port",
                "name": "my-secret"
              }
            },
            "sslMode": {
              "secretKeyRef": {
                "key": "sslmode",
                "name": "my-secret"
              }
            },
            "username": {
              "secretKeyRef": {
                "key": "user",
                "name": "my-secret"
              }
            }
          }
        },
        {
          "apiVersion": "postgres.oebc.tools/v1",
          "kind": "PgUser",
          "metadata": {
            "labels": {
              "app.kubernetes.io/created-by": "postgres-operator",
              "app.kubernetes.io/instance": "pguser-sample",
              "app.kubernetes.io/managed-by": "kustomize",
              "app.kubernetes.io/name": "pguser",
              "app.kubernetes.io/part-of": "postgres-operator"
            },
            "name": "myuser"
          },
          "spec": {
            "databases": [
              {
                "name": "mydb",
                "owner": true,
                "privileges": [
                  "CONNECT",
                  "CREATE"
                ]
              }
            ],
            "instance": {
              "name": "my-instance",
              "namespace": "default"
            },
            "secret": {
              "name": "dummy"
            }
          }
        }
      ]
    capabilities: Basic Install
    createdAt: "2026-08-31T16:19:33Z"
    operators.operatorframework.io/builder: operator-sdk-v1.42.3
    operators.operatorframework.io/project_layout: go.kubebuilder.io/v4
  name: postgres-operator.v0.0.1
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - description: PgDatabase is the Schema for the pgdatabases API
      displayName: Pg Database
      kind: PgDatabase
      name: pgdatabases.postgres.oebc.tools
      version: v1
    - description: PgInstance is the Schema for the pginstances API
      displayName: Pg Instance
      kind: PgInstance
      name: pginstances.postgres.oebc.tools
      version: v1
    - description: PgUser is the Schema for the pgusers API
      displayName: Pg User
      kind: PgUser
      name: pgusers.postgres.oebc.tools
      version: v1
  description: The Yamaha Motor eBike Systems Postgres Operator allows the management of databases and
    users on multiple postgres instances. The Postgres Instances need to be provisioned
    externally or by another operator.
  displayName: Yamaha Motor eBike Systems Postgres Operator
  icon:
  - base64data: ""
    mediatype: ""
  install:
    spec:
      clusterPermissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
        - apiGroups:
          - ""
          resources:
          - secrets
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - postgres.oebc.tools
          resources:
          - pgdatabases
          - pginstances
          - pgusers
          verbs:
          - create
          - delete
          - get
          - list
          - patch
          - update
          - watch
        - apiGroups:
          - postgres.oebc.tools
          resources:
          - pgdatabases/finalizers
          - pginstances/finalizers
          - pgusers/finalizers
          verbs:
          - update
        - apiGroups:
          - postgres.oebc.tools
          resources:
          - pgdatabases/status
          - pginstances/status
          - pgusers/status
          verbs:
          - get
          - patch
          - update
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
        - apiGroups:
          - authorization.k8s.io
          resources:
          - subjectaccessreviews
          verbs:
          - create
        serviceAccountName: postgres-operator-controller-manager
      deployments:
      - label:
          app.kubernetes.io/component: manager
          app.kubernetes.io/created-by: postgres-operator
          app.kubernetes.io/instance: controller-manager
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: deployment
          app.kubernetes.io/part-of: postgres-operator
          control-plane: controller-manager
        name: postgres-operator-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                control-plane: controller-manager
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: kubernetes.io/arch
                        operator: In
                        values:
                        - amd64
                        - arm64
                        - ppc64le
                        - s390x
                      - key: kubernetes.io/os
                        operator: In
                        values:
                        - linux
              containers:
              - args:
                - --leader-elect
                command:
                - /manager
                image: ghcr.io/brose-ebike/postgres-operator:v0.0.6
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 8443
                  name: https
                  protocol: TCP
                - containerPort: 8081
                  name: health
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: 500m
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
              securityContext:
                runAsNonRoot: true
              serviceAccountName: postgres-operator-controller-manager
              terminationGracePeriodSeconds: 10
      permissions:
      - rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - coordination.k8s.io
          resources:
          - leases
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        - apiGroups:
          - ""
          resources:
          - events
          verbs:
          - create
          - patch
        serviceAccountName: postgres-operator-controller-manager
    strategy: deployment
  installModes:
  - supported: false
    type: OwnNamespace
  - supported: false
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - postgres
  - postgresql
  - user
  - users
  - role
  - roles
  - database
  - databases
  - privilege
  - privileges
  links:
  - name: Postgres Operator
    url: https://postgres-operator.domain
  maintainers:
  - email: 10846939+raynigon@users.noreply.github.com
    name: Simon Schneider
  - email: lucas.duerksen@yamaha-ebike-systems.com
    name: Lucas Dürksen
  maturity: alpha
  provider:
    name: Yamaha Motor eBike Systems GmbH
    url: https://one-ebike.cloud
  version: 0.0.1
