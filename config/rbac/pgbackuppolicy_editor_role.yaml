# permissions for end users to edit pgbackuppolicies.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: pgbackuppolicy-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: postgres-operator
    app.kubernetes.io/part-of: postgres-operator
    app.kubernetes.io/managed-by: kustomize
  name: pgbackuppolicy-editor-role
rules:
- apiGroups:
  - postgres.oebc.tools
  resources:
  - pgbackuppolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - postgres.oebc.tools
  resources:
  - pgbackuppolicies/status
  verbs:
  - get
