                    - s3
                    type: string
                required:
                - type
                type: object
              message:
                description: Message carries a human readable status/error message.
                type: string
              phase:
                default: Pending
                description: Phase is the current lifecycle phase of this backup attempt.
                enum:
                - Pending
                - Success
                - Failure
                type: string
              sizeBytes:
                description: SizeBytes is the size in bytes of the stored (possibly
                  encrypted) object.
                format: int64
                type: integer
              startedAt:
                description: StartedAt is when the backup attempt started.
                format: date-time
                type: string
            type: object
