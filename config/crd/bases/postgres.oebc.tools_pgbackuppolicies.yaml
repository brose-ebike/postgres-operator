  names:
    kind: PgBackupPolicy
    listKind: PgBackupPolicyList
    plural: pgbackuppolicies
    singular: pgbackuppolicy
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: PgBackupPolicy is the Schema for the pgbackuppolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PgBackupPolicySpec defines the desired state of PgBackupPolicy
            properties:
              dumpOptions:
                description: |-
                  DumpOptions configures defaults applied to every dump this policy
                  triggers.
                properties:
                  compressionLevel:
                    description: CompressionLevel is passed as pg_dump --compress=<n>.
                    format: int32
                    maximum: 9
                    minimum: 0
                    type: integer
                  format:
                    default: custom
                    description: |-
                      Format selects the pg_dump --format value. The "directory" format is
                      tarred and gzipped into a single object before upload.
                    enum:
                    - plain
                    - custom
                    - tar
                    - directory
                    type: string
                type: object
              encryption:
                description: |-
                  Encryption optionally configures at-rest encryption. Unset means
                  dumps are stored unencrypted.
                properties:
                  secretKeyRef:
                    description: |-
                      SecretKeyRef selects the key material (public key for gpg-rsa,
                      passphrase for gpg-aes).
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  type:
                    description: Type selects the encryption scheme.
                    enum:
                    - gpg-rsa
                    - gpg-aes
                    type: string
                required:
                - secretKeyRef
                - type
                type: object
              retention:
                description: Retention configures how long/how many backups are kept
                  per database.
                properties:
                  maxAge:
                    description: |-
                      MaxAge is the maximum age a backup may reach before it becomes
                      eligible for deletion (subject to MinCount salvage).
                    type: string
                  minCount:
                    description: |-
                      MinCount is a hard floor: at least this many of the newest backups of
                      each database are always kept, regardless of MaxAge.
                    format: int32
                    type: integer
                type: object
              schedule:
                description: Schedule is a cron expression controlling how often the
                  dump CronJob runs.
                type: string
              storage:
                description: Storage selects and configures the backup destination.
                properties:
                  s3:
                    description: S3 holds the configuration when Type is "s3".
                    properties:
                      bucket:
                        description: |-
                          Bucket is the name of the bucket dumps are stored in. It is created
                          automatically if it does not exist.
                        type: string
                      endpoint:
                        description: Endpoint is the S3-compatible endpoint, host[:port],
                          without scheme.
                        type: string
                      prefix:
                        description: Prefix is an optional key prefix under which
                          objects are stored.
                        type: string
                      secretRef:
                        description: |-
                          SecretRef references a Secret containing the access/secret key pair,
                          under the keys PgBackupStorageS3SecretKeyAccessKey/SecretKey.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      secure:
                        default: true
                        description: |-
                          Secure selects whether TLS is used to talk to the endpoint.
                          A *bool, not bool: with a plain bool, encoding/json's "omitempty"
                          drops an explicit "false" from the request body indistinguishably
                          from "unset", so the apiserver's CRD default (true) would silently
                          override it on every create/update.
                        type: boolean
                      url:
                        description: |-
                          URL is populated only in PgBackupInstanceStatus.Location, giving the
                          fully resolved object address. Unused in PgBackupPolicySpec.Storage.
                        type: string
                    type: object
                  type:
                    description: Type selects which of the sub-structs below is populated.
                    enum:
                    - s3
                    type: string
                required:
                - type
                type: object
              workspaceSizeLimit:
                anyOf:
                - type: integer
                - type: string
                default: 10Gi
                description: |-
                  WorkspaceSizeLimit bounds the ephemeral scratch volume used for the
                  dump (and its encrypted copy) during a backup run. Should be sized to
                  roughly 2x the largest target database's on-disk size. Defaults to
                  10Gi if unset.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
            required:
            - retention
            - schedule
            - storage
            type: object
          status:
            description: PgBackupPolicyStatus defines the observed state of PgBackupPolicy
            properties:
              conditions:
                description: |-
                  Conditions represent the current state of this policy.
                  Supported Condition Types:
                  - pgbackuppolicy.postgres.oebc.tools/ready true if storage/encryption secrets resolve
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
